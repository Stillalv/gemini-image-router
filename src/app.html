<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Gemini Image Router</title>
    <!-- Prevent Theme FOUC / Initial Flash -->
    <script>
      (function () {
        try {
          var raw = localStorage.getItem('gemini_theme_config');
          var cfg = raw ? JSON.parse(raw) : { mode: 'light', fontSize: 'normal', fontFamily: 'sans' };
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          var isDark = cfg.mode === 'dark' || (cfg.mode === 'system' && prefersDark);
          var root = document.documentElement;
          if (isDark) {
            root.classList.add('dark');
            root.style.colorScheme = 'dark';
          } else {
            root.classList.remove('dark');
            root.style.colorScheme = 'light';
          }
          var fontSizes = { small: '13px', normal: '14px', large: '16px' };
          root.style.setProperty('--app-font-size', fontSizes[cfg.fontSize] || '14px');
          var fontFamilies = {
            sans: '-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif',
            geist: '"Geist", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif',
            mono: '"Fira Code", Consolas, Monaco, "Courier New", monospace',
            serif: 'Merriweather, Georgia, Cambria, "Times New Roman", serif'
          };
          root.style.setProperty('--app-font-family', fontFamilies[cfg.fontFamily] || fontFamilies.sans);
        } catch (e) {}
      })();
    </script>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover" class="antialiased selection:bg-neutral-200 dark:selection:bg-neutral-800">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
